<!DOCTYPE html>
<html>
    <head>
        <title>Checkout</title>
        <link rel="stylesheet" href="Css/checkout.css">
       
    </head>
    <body>
    <div class="check-header">
        <div> 
          <a href="amazonmain.html" class="check-first-header"><img src="images/amazon-logo.png"></a>
        </div>
        <div class="check-middle-header"> Checkout(items <span class="js-citems"></span>)</div>
        <div class="check-last-header">
            <img src="images/icons/checkout-lock-icon.png">
        </div>
    </div>

    <div class="check-gap"></div>

    <div class="check-body">
        <div class="check-review">Review your order</div>
    <div class="check-op js-checkout-list">
    </div>
    <div class="check-pay">

    <div class="check-os">
      <div class="check-ord">Order Summary</div>
      <div class="grid">
        <div>Items (3):</div>
        <div>$42.75</div>
      </div>

      <div class="grid">
        <div>Shipping & handling:</div>
        <div>$4.99</div>
      </div>

      <div class="grid">
        <div class="total-tax">Total before tax:</div>
        <div class="grid-tot">$47.74</div>
      </div>

      <div class="grid">
        <div>Estimated tax (10%):</div>
        <div>$4.77</div>
      </div>

      <div class="grid-tot-ord">
        <div class="ord" >Order total:</div>
        <div>$52.51</div>
      </div>
      <div class="grid">
      <button class="po-butt">Place your order</button>
      </div>
    </div>
    </div>
</div>
<script type="module" src="Scripts/checkout.js"> </script>
    </body>
</html>
