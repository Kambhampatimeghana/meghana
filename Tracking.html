<!DOCTYPE html>
<html>
    <head>
        <title>Tracking</title>
        <link rel="stylesheet" href="Css/Tracking.css">
    </head>
    <body>
        <div class="header">
            <div class="left-header">
                <a href="amazonmain.html" class="pro-link">
                    <img class="amz-img" src="images/amazon-logo-white.png">
                    </a>
            </div>
            <div class="middle-header">
                <input class="middle-search" placeholder="Search">
                <button class="search-button">
                <img class="button-image" src="images/icons/search-icon.png">
                </button>
            </div>
            <div class="right-header"> 
                <div class="r-o">
                <a href="" class="retu">Returns</a>
                <a href="" class="retu-o">&Orders</a>
                </div>
                <div class="amz-cart">
                    <div>
                        <a href="checkout.html">
                    <img class="cart-img" src="images/icons/cart-icon.png">
                    <span class="cart-count">3</span>
                    </div>
                    <div class="cart">Cart</div>
                    </a>
                </div>
                
                </div>
            </div>
            <div class="tr-gap"></div>
        <div class="tracking-body">
            <div class="view">
                <a class="link" href="orders.html">View all orders</a>
            </div>
            <div class="abt-pro">
                <div class="product-details">
                    <div class="pro-det">Arriving on Monday, June 13</div>
                    <div class="pro-mat">Black and Grey Athletic Cotton Socks -  6 Pairs</div>
                    <div class="tr-qunt">Quantity: 1</div>
                </div>
                <div class="tr-img">
                    <img class="tr-socks" src="images/products/athletic-cotton-socks-6-pairs.jpg">
                </div>
                <div class="del-time">
                    <div class="abt-time">
                        <div class="pre">Preparing</div>
                        <div class="shipd">Shipped</div>
                        <div class="delvd">Delivered</div>
                    </div>
                    <div class="progress-bar-label">
                       
                        <div class="progress-bar"></div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
